    <script>
      // Simple client-side include for <!--#include file="..." -->
      document.addEventListener("DOMContentLoaded", function () {
        const includeTags = Array.from(
          document.querySelectorAll("body,head"),
        ).flatMap((el) => {
          // Find all comments in body and head
          const walker = document.createTreeWalker(
            el,
            NodeFilter.SHOW_COMMENT,
            null,
            false,
          );
          let node,
            nodes = [];
          while ((node = walker.nextNode())) nodes.push(node);
          return nodes;
        });
        includeTags.forEach(async (commentNode) => {
          const match = commentNode.nodeValue.match(
            /#include file=["'](.+?)["']/,
          );
          if (match) {
            const file = match[1];
            try {
              const resp = await fetch(file);
              if (resp.ok) {
                const html = await resp.text();
                const temp = document.createElement("div");
                temp.innerHTML = html;
                // Insert all children before the comment
                while (temp.firstChild) {
                  commentNode.parentNode.insertBefore(
                    temp.firstChild,
                    commentNode,
                  );
                }
                commentNode.parentNode.removeChild(commentNode);
              }
            } catch (e) {
              // Fail silently
            }
          }
        });
      });
    </script>
